name: verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verify gate
        run: npm run verify

  machine-setup-contract:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test machine migration tooling
        run: npm run test:machine-setup

      - name: Test immutable recovery tooling
        run: npm run test:recovery

      - name: Validate pinned devkit bootstrap contract
        run: npm run devkit:ensure -- --dry-run --json

      - name: Exercise standalone product setup plan
        run: npm run setup:repo -- --dry-run
