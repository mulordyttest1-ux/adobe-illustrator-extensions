<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imposition Panel</title>
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline' 'unsafe-eval';">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="container-fluid">
    <header class="panel-header">
        <div class="panel-brand">
            <strong>Imposition</strong>
            <span class="panel-subtitle">Chạy Preset và chỉnh cấu hình</span>
        </div>
        <div class="panel-header-actions">
            <div class="panel-tabs" role="tablist" aria-label="Điều hướng panel">
                <button type="button" id="tab-action-btn" class="panel-tab is-active" role="tab" aria-selected="true" aria-controls="tab-action" tabindex="0" data-tab-target="action">Chạy</button>
                <button type="button" id="tab-config-btn" class="panel-tab" role="tab" aria-selected="false" aria-controls="tab-config" tabindex="-1" data-tab-target="config">Cấu hình</button>
                <button type="button" id="tab-suite-btn" class="panel-tab" role="tab" aria-selected="false" aria-controls="tab-suite" tabindex="-1" data-tab-target="suite">Bo thiep</button>
            </div>
            <button type="button" id="btn-reload-panel" class="panel-icon-btn" title="Tải lại panel" aria-label="Tải lại panel">↻</button>
        </div>
    </header>

    <main>
        <section id="tab-action" class="tab-content" role="tabpanel" aria-labelledby="tab-action-btn">
            <article id="action-container">
                <span class="panel-loading-text">Đang tải danh sách...</span>
            </article>
        </section>

        <section id="tab-config" class="tab-content" role="tabpanel" aria-labelledby="tab-config-btn" hidden>
            <article id="config-container">
                <span aria-busy="true" class="panel-loading-text">Đang tải cấu hình...</span>
            </article>
        </section>

        <section id="tab-suite" class="tab-content" role="tabpanel" aria-labelledby="tab-suite-btn" hidden>
            <article id="suite-container">
                <span aria-busy="true" class="panel-loading-text">Dang tai wedding suite workspace...</span>
            </article>
        </section>
    </main>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script>
        (function() {
            var ORDER = ['action', 'config', 'suite'];

            function getTabButton(name) {
                return document.getElementById('tab-' + name + '-btn');
            }

            function getTabPanel(name) {
                return document.getElementById('tab-' + name);
            }

            window.switchTab = function(tabName) {
                if (window.Imposition && typeof window.Imposition.dismissTransientUi === 'function') {
                    window.Imposition.dismissTransientUi();
                }

                ORDER.forEach(function(name) {
                    var button = getTabButton(name);
                    var panel = getTabPanel(name);
                    var isActive = name === tabName;

                    if (button) {
                        button.classList.toggle('is-active', isActive);
                        button.setAttribute('aria-selected', isActive ? 'true' : 'false');
                        button.setAttribute('tabindex', isActive ? '0' : '-1');
                    }

                    if (panel) {
                        panel.hidden = !isActive;
                    }
                });
            };

            function focusTabByOffset(currentName, offset) {
                var currentIndex = ORDER.indexOf(currentName);
                var nextIndex = (currentIndex + offset + ORDER.length) % ORDER.length;
                var nextName = ORDER[nextIndex];
                var button = getTabButton(nextName);
                if (button) {
                    window.switchTab(nextName);
                    button.focus();
                }
            }

            document.addEventListener('click', function(event) {
                var tabButton = event.target.closest('[data-tab-target]');
                if (tabButton) {
                    event.preventDefault();
                    window.switchTab(tabButton.getAttribute('data-tab-target'));
                    return;
                }

                if (event.target && event.target.id === 'btn-reload-panel') {
                    event.preventDefault();
                    location.reload();
                }
            });

            document.addEventListener('keydown', function(event) {
                var button = event.target.closest('[role="tab"]');
                if (!button) return;

                var currentName = button.getAttribute('data-tab-target');
                if (event.key === 'ArrowRight') {
                    event.preventDefault();
                    focusTabByOffset(currentName, 1);
                } else if (event.key === 'ArrowLeft') {
                    event.preventDefault();
                    focusTabByOffset(currentName, -1);
                } else if (event.key === 'Home') {
                    event.preventDefault();
                    window.switchTab(ORDER[0]);
                    getTabButton(ORDER[0]).focus();
                } else if (event.key === 'End') {
                    event.preventDefault();
                    window.switchTab(ORDER[ORDER.length - 1]);
                    getTabButton(ORDER[ORDER.length - 1]).focus();
                } else if (event.key === ' ' || event.key === 'Enter') {
                    event.preventDefault();
                    window.switchTab(currentName);
                }
            });

            document.addEventListener('DOMContentLoaded', function() {
                window.switchTab('action');
            });
        })();
    </script>

    <script src="lib/CSInterface.js" charset="utf-8"></script>
    <script src="js/libs/fuse.basic.min.js?v=2" charset="utf-8"></script>
    <script src="js/bundle.js" charset="utf-8"></script>
</body>

</html>
